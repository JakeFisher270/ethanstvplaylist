name: Refresh E Streams Live Playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '40 10 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_estre_playlist.py
      - name: Commit new playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EthansTV-combined.m3u
          git diff --cached --quiet || (git commit -m 'Refresh E Streams live playlist' && git push)
